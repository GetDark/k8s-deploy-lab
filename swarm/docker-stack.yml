version: "3.9"

services:
  app:
    image: ghcr.io/getdark/demo-app:latest
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    environment:
      APP_ENV: production
    secrets:
      - database_url
      - secret_key
    networks: [webnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    networks: [webnet]
    deploy:
      replicas: 1

networks:
  webnet:
    driver: overlay
    attachable: true

secrets:
  database_url:
    external: true
  secret_key:
    external: true

configs:
  nginx_conf:
    external: true
