replicaCount: 2

image:
  repository: ghcr.io/getdark/demo-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: app.yourdomain.com
  tls: true
  certIssuer: letsencrypt-prod

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  APP_ENV: production
  LOG_LEVEL: info
  WORKERS: "2"

secrets:
  DATABASE_URL: ""
  SECRET_KEY: ""

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
